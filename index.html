<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Developed by Shakil</title>
  <link rel="icon" type="image/x-icon" href="DevShakil.png">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background-color: #f7f9fc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 20px;
      background-image: radial-gradient(#d1d5db 1px, transparent 1px);
      background-size: 20px 20px;
    }

    .page-container {
      width: 100%;
      max-width: 1400px;
      display: flex;
      flex-direction: column;
      margin: 0 auto;
    }

    .header-bar {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 30px;
    }

    .brand-logo {
      height: 48px;
      object-fit: contain;
    }

    .header-user-name {
      font-size: 24px;
      font-weight: 800;
      color: #000000;
      letter-spacing: 0.5px;
    }

    .app-layout {
      display: flex;
      flex-direction: row;
      align-items: flex-start;
      width: 100%;
      gap: 20px;
      padding-top: 40px;
    }

    .left-section {
      width: 70%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 40px;
    }

    .left-wheel-section {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .wheel-wrapper {
      position: relative;
      width: 520px;
      height: 520px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #wheelCanvas {
      width: 520px;
      height: 520px;
      border-radius: 50%;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
      cursor: pointer;
    }

    .pointer-arrow {
      position: absolute;
      right: -16px;
      top: 50%;
      transform: translateY(-50%);
      width: 0;
      height: 0;
      border-top: 18px solid transparent;
      border-bottom: 18px solid transparent;
      border-right: 28px solid #b0bec5;
      z-index: 5;
    }

    .suggestions-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 12px;
    }

    .suggestions-title {
      font-size: 14px;
      font-weight: 800;
      color: #374151;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .pill-list {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .name-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 22px;
      border-radius: 50px;
      color: #ffffff;
      font-weight: bold;
      font-size: 15px;
      border: none;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
      transition: transform 0.2s, filter 0.2s;
    }

    .name-pill:hover {
      transform: translateY(-2px);
      filter: brightness(1.08);
    }

    .right-card-section {
      width: 30%;
      display: flex;
      justify-content: flex-end;
    }

    .card-remains {
      background: #ffffff;
      border-radius: 20px;
      padding: 24px;
      width: 100%;
      max-width: 340px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card-banner-img {
      width: 100%;
      height: 120px;
      border-radius: 12px;
      object-fit: cover;
    }

    .remains-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .remains-header h3 {
      font-size: 18px;
      color: #000000;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .add-name-form {
      display: flex;
      gap: 8px;
      width: 100%;
    }

    .add-name-input {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    .add-name-input:focus {
      border-color: #3b82f6;
    }

    .btn-add-name {
      background: #231f1f;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-add-name:hover {
      background: #059669;
    }

    .btn-team-modal {
      background: #f3f4f6;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 6px 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 700;
      color: #374151;
      transition: background-color 0.2s;
    }

    .btn-team-modal:hover {
      background: #e5e7eb;
    }

    .btn-team-modal svg {
      width: 18px;
      height: 18px;
      fill: #374151;
    }

    .remains-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 260px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .remains-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #f3f4f6;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      color: #1f2937;
    }

    .remains-item .remove-btn {
      cursor: pointer;
      color: #6b7280;
      font-size: 16px;
      font-weight: bold;
      line-height: 1;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .remains-item .remove-btn:hover {
      color: #ef4444;
      background-color: #e5e7eb;
    }

    .btn-run {
      background-color: #ff3b30;
      color: white;
      border: none;
      padding: 12px 0;
      border-radius: 20px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      text-align: center;
      transition: background-color 0.2s;
      margin-top: 8px;
    }

    .btn-run:hover {
      background-color: #e02d22;
    }

    .btn-run:disabled {
      background-color: #f87171;
      cursor: not-allowed;
    }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(0, 0, 0, 0.5);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease-in-out;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    /* Winner Modal */
    .winner-modal-card {
      background-color: #f7f9fc;
      background-image: radial-gradient(#d1d5db 1px, transparent 1px);
      background-size: 20px 20px;
      border-radius: 24px;
      padding: 25px;
      width: 75vw;
      height: 75vh;
      max-width: 1000px;
      max-height: 700px;
      position: relative;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      transform: scale(0.9);
      transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .modal-overlay.active .winner-modal-card {
      transform: scale(1);
    }

    .video-frame {
      width: 100%;
      height: calc(100% - 80px);
      background: #000000;
      border-radius: 16px;
      overflow: hidden;
      display: block;
      position: relative;
    }

    .video-frame.hidden {
      display: none !important;
    }

    .video-frame video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .video-frame video::-webkit-media-controls {
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .video-frame:hover video::-webkit-media-controls {
      opacity: 1;
    }

    .winner-modal-card.no-video-card {
      height: auto;
      min-height: 320px;
      justify-content: center;
      align-items: center;
      padding: 50px 30px;
    }

    .winner-modal-card.no-video-card .modal-footer {
      width: 100%;
      flex-direction: column;
      justify-content: center;
      gap: 30px;
      height: auto;
    }

    .winner-modal-card.no-video-card .winner-name {
      font-size: 64px;
      text-align: center;
    }

    .modal-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 65px;
      position: relative;
      padding: 0 10px;
    }

    .winner-name {
      font-size: 42px;
      font-weight: 900;
      color: #ff5500;
      letter-spacing: 1.5px;
      z-index: 2;
    }

    .btn-remove-next {
      background-color: #ff3b30;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 14px;
      font-weight: bold;
      border-radius: 20px;
      cursor: pointer;
      z-index: 2;
    }

    .btn-remove-next:hover {
      background-color: #e02d22;
    }

    /* Team Management Modal */
    .team-modal-card {
      background: #ffffff;
      border-radius: 24px;
      padding: 30px;
      width: 85vw;
      max-width: 900px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      gap: 20px;
      position: relative;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
      overflow-y: auto;
    }

    .team-modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .team-modal-header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .team-modal-header h2 {
      font-size: 22px;
      font-weight: 800;
      color: #111827;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .btn-shuffle {
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 6px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.2s;
    }

    .btn-shuffle:hover {
      background-color: #f3f4f6;
    }

    .btn-shuffle svg {
      width: 20px;
      height: 20px;
      fill: #4b5563;
    }

    .team-modal-header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .team-select-wrapper {
      display: flex;
      align-items: center;
      background: #000000;
      color: #ffffff;
      padding: 6px 12px;
      border-radius: 8px;
      gap: 8px;
      font-size: 13px;
      font-weight: 700;
    }

    .team-select-wrapper select {
      background: transparent;
      color: #ffffff;
      border: none;
      outline: none;
      font-weight: bold;
      cursor: pointer;
    }

    .team-select-wrapper select option {
      background: #000000;
      color: #ffffff;
    }

    .close-modal-btn {
      background: none;
      border: none;
      font-size: 24px;
      font-weight: bold;
      color: #9ca3af;
      cursor: pointer;
    }

    .close-modal-btn:hover {
      color: #111827;
    }

    .teams-grid {
      display: grid;
      gap: 20px;
      width: 100%;
    }

    .teams-grid.teams-2 {
      grid-template-columns: repeat(2, 1fr);
    }

    .teams-grid.teams-3 {
      grid-template-columns: repeat(3, 1fr);
    }

    .teams-grid.teams-4 {
      grid-template-columns: repeat(4, 1fr);
    }

    .team-column {
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: #ffffff;
      border-radius: 12px;
    }

    .team-column-title {
      font-size: 18px;
      font-weight: 700;
      color: #1f2937;
    }

    .team-members-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-height: 180px;
    }

    .team-member-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #f3f4f6;
      padding: 8px 12px;
      border-radius: 8px;
    }

    .member-name {
      font-size: 13px;
      font-weight: 600;
      color: #374151;
    }

    .points-control {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      padding: 2px 6px;
    }

    .points-val {
      font-size: 13px;
      font-weight: 700;
      color: #111827;
      min-width: 16px;
      text-align: center;
    }

    .btn-point {
      border: none;
      background: transparent;
      cursor: pointer;
      font-weight: bold;
      color: #4b5563;
      font-size: 14px;
      line-height: 1;
      padding: 0 2px;
    }

    .btn-point:hover {
      color: #111827;
    }

    .team-total-row {
      margin-top: 10px;
      padding-top: 12px;
      border-top: 2px dashed #e5e7eb;
      font-size: 14px;
      font-weight: 700;
      color: #374151;
    }

    @media (max-width: 900px) {
      .brand-logo{
        height: 27px;
      }
      .header-user-name{
        font-size: 18px;
      }
      .winner-name{
        font-size: 24px;
      }
      .app-layout {
        flex-direction: column;
      }
      .left-section, .right-card-section {
        width: 100%;
        justify-content: center;
      }
      .wheel-wrapper {
        width: 360px;
        height: 360px;
      }
      #wheelCanvas {
        width: 360px;
        height: 360px;
      }
      .winner-modal-card {
        width: 90vw;
        height: 80vh;
      }
      .teams-grid.teams-2, .teams-grid.teams-3, .teams-grid.teams-4 {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <div class="page-container">
    <div class="header-bar">
      <img src="10_Minute_School_Logo.webp" alt="10 Minute School Logo" class="brand-logo" id="logoImg">
      <div class="header-user-name">PARTHONA <span style="color: #e02d22;">HOQUE</span></div>
    </div>

    <div class="app-layout">
      <div class="left-section">
        <div class="left-wheel-section">
          <div class="wheel-wrapper">
            <canvas id="wheelCanvas" width="1040" height="1040"></canvas>
            <div class="pointer-arrow"></div>
          </div>
        </div>

        <div class="suggestions-container" id="suggestionsContainer">
          <div class="suggestions-title">Available Suggestions</div>
          <div class="pill-list" id="pillList"></div>
        </div>
      </div>

      <div class="right-card-section">
        <div class="card-remains">
          <img src="cover.JPG" alt="Team" class="card-banner-img">
          <div class="remains-header">
            <h3>REMAINS</h3>
            <button class="btn-team-modal" onclick="openTeamModal()">
              <svg viewBox="0 0 24 24">
                <path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/>
              </svg>
              Team
            </button>
          </div>

          <div class="add-name-form">
            <input type="text" id="manualNameInput" class="add-name-input" placeholder="Enter name..." onkeydown="handleManualInputKeyDown(event)">
            <button class="btn-add-name" onclick="addManualName()">Add</button>
          </div>

          <div class="remains-list" id="remainsList"></div>

          <button class="btn-run" id="runBtn" onclick="spinWheel()">Run</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Winner Modal -->
  <div class="modal-overlay" id="modalOverlay" onclick="handleOverlayClick(event)">
    <div class="winner-modal-card" id="modalCard">
      <div class="video-frame" id="videoFrame">
        <video id="winnerVideo"></video>
      </div>
      <div class="modal-footer">
        <div class="winner-name" id="winnerNameDisplay">TUBA</div>
        <button class="btn-remove-next" onclick="removeAndNext()">Remove & Next</button>
      </div>
    </div>
  </div>

  <!-- Team Management Modal -->
  <div class="modal-overlay" id="teamModalOverlay" onclick="handleTeamOverlayClick(event)">
    <div class="team-modal-card" id="teamModalCard">
      <div class="team-modal-header">
        <div class="team-modal-header-left">
          <h2>TEAM</h2>
          <button class="btn-shuffle" onclick="shuffleTeams()" title="Shuffle Members">
            <svg viewBox="0 0 24 24">
              <path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.45 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/>
            </svg>
          </button>
        </div>
        <div class="team-modal-header-right">
          <div class="team-select-wrapper">
            <span>Total</span>
            <select id="teamCountSelect" onchange="changeTeamCount(this.value)">
              <option value="2">2</option>
              <option value="3">3</option>
              <option value="4">4</option>
            </select>
          </div>
          <button class="close-modal-btn" onclick="closeTeamModal()">&times;</button>
        </div>
      </div>

      <div class="teams-grid teams-2" id="teamsGrid"></div>
    </div>
  </div>

  <audio id="spinSound" src="button-click/spin.mp3" preload="auto" loop></audio>

  <script>
    const palette = ['#e53935', '#1e88e5', '#f57c00', '#43a047', '#9c27b0', '#00acc1'];
    const masterList = ["Tania", "Yaad", "Tanisha", "Sorme", "Maysha", "Shakil","Mahir","Suvo","Parthona","Riyad","Wilson","Rehan","Mehnaz","Rasel","Himel","Raihan","Tuba","Israt","Dipto"];

    let names = ["Tania", "Mehnaz", "Maysha", "Tuba", "Rasel"];
    let currentRotation = 0;
    let isSpinning = false;
    let selectedWinner = "";

    // Team management state
    let teamCount = 2;
    let teamAssignments = []; // [{ name, points, teamIndex }]

    const canvas = document.getElementById("wheelCanvas");
    const ctx = canvas.getContext("2d");
    const videoElement = document.getElementById("winnerVideo");

    document.getElementById("logoImg").onerror = function() {
      this.src = "https://10minuteschool.com/assets/icons/10ms-logo.svg";
    };

    videoElement.addEventListener("error", function() {
      document.getElementById("videoFrame").classList.add("hidden");
      document.getElementById("modalCard").classList.add("no-video-card");
    });

    function renderRemainsList() {
      const listContainer = document.getElementById("remainsList");
      listContainer.innerHTML = "";
      names.forEach((name, index) => {
        const item = document.createElement("div");
        item.className = "remains-item";
        item.innerHTML = `
          <span>${name}</span>
          <span class="remove-btn" onclick="removeNameAtIndex(${index})">&times;</span>
        `;
        listContainer.appendChild(item);
      });
    }

    function removeNameAtIndex(index) {
      if (isSpinning) return;
      names.splice(index, 1);
      handleDataUpdate();
    }

    function handleDataUpdate() {
      renderRemainsList();
      drawWheel();
      updateSuggestions();
      syncTeamData();
    }

    function updateSuggestions() {
      const pillList = document.getElementById("pillList");
      const suggestionsContainer = document.getElementById("suggestionsContainer");
      pillList.innerHTML = "";

      const currentLower = names.map(n => n.toLowerCase());
      const available = masterList.filter(name => !currentLower.includes(name.toLowerCase()));

      if (available.length === 0) {
        suggestionsContainer.style.display = "none";
        return;
      }
      
      suggestionsContainer.style.display = "flex";

      available.forEach((name, idx) => {
        const btn = document.createElement("button");
        btn.className = "name-pill";
        btn.innerText = name;
        btn.style.backgroundColor = palette[idx % palette.length];
        btn.onclick = () => addNameToWheel(name);
        pillList.appendChild(btn);
      });
    }

    function addNameToWheel(name) {
      if (isSpinning) return;
      names.push(name);
      handleDataUpdate();
    }

    function addManualName() {
      if (isSpinning) return;
      const input = document.getElementById("manualNameInput");
      const trimmedName = input.value.trim();
      if (trimmedName.length > 0) {
        addNameToWheel(trimmedName);
        input.value = "";
      }
    }

    function handleManualInputKeyDown(event) {
      if (event.key === "Enter") {
        addManualName();
      }
    }

    function getSliceColor(index, total) {
      if (total <= 1) return palette[0];
      let colorIndex = index % palette.length;
      if (index === total - 1 && colorIndex === 0 && total % palette.length === 1) {
        colorIndex = 1;
      }
      return palette[colorIndex];
    }

    function drawWheel() {
      const numSlices = names.length;
      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;
      const radius = centerX - 10;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (numSlices === 0) {
        ctx.beginPath();
        ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
        ctx.fillStyle = "#e5e7eb";
        ctx.fill();
        return;
      }

      const sliceAngle = (2 * Math.PI) / numSlices;

      for (let i = 0; i < numSlices; i++) {
        const startAngle = currentRotation + (i * sliceAngle);
        const endAngle = startAngle + sliceAngle;

        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.arc(centerX, centerY, radius, startAngle, endAngle);
        ctx.closePath();
        ctx.fillStyle = getSliceColor(i, numSlices);
        ctx.fill();

        ctx.save();
        ctx.translate(centerX, centerY);
        ctx.rotate(startAngle + sliceAngle / 2);
        ctx.textAlign = "right";
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 44px Arial";
        ctx.fillText(names[i], radius - 50, 16);
        ctx.restore();
      }

      ctx.beginPath();
      ctx.arc(centerX, centerY, 90, 0, 2 * Math.PI);
      ctx.fillStyle = "#ffffff";
      ctx.fill();
      ctx.strokeStyle = "#d1d5db";
      ctx.lineWidth = 4;
      ctx.stroke();

      ctx.fillStyle = "#000000";
      ctx.font = "bold 48px Arial";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("C1", centerX, centerY);
    }

    function spinWheel() {
      if (names.length === 0 || isSpinning) return;

      isSpinning = true;
      document.getElementById("runBtn").disabled = true;

      const winningIndex = Math.floor(Math.random() * names.length);
      selectedWinner = names[winningIndex];

      const sliceAngle = (2 * Math.PI) / names.length;
      const sliceCenter = (winningIndex + 0.5) * sliceAngle;
      const targetModulo = (2 * Math.PI - sliceCenter) % (2 * Math.PI);

      const fullSpins = 6 * 2 * Math.PI;
      const startRotation = currentRotation;
      const currentModulo = startRotation % (2 * Math.PI);
      
      let extraRotation = targetModulo - currentModulo;
      if (extraRotation < 0) extraRotation += 2 * Math.PI;

      const totalTargetRotation = startRotation + fullSpins + extraRotation;

      const startTime = performance.now();
      const duration = 3400;

      const spinAudio = document.getElementById("spinSound");
      if (spinAudio) {
        spinAudio.currentTime = 0;
        spinAudio.playbackRate = 1.0;
        spinAudio.play().catch(() => {});
      }

      function animate(currentTime) {
        const elapsed = currentTime - startTime;
        const progress = Math.min(elapsed / duration, 1);
        
        const easeOut = 1 - Math.pow(1 - progress, 3);
        currentRotation = startRotation + (totalTargetRotation - startRotation) * easeOut;

        drawWheel();

        if (progress < 1) {
          requestAnimationFrame(animate);
        } else {
          currentRotation = totalTargetRotation;
          drawWheel();
          
          if (spinAudio) {
            spinAudio.pause();
            spinAudio.currentTime = 0;
          }

          setTimeout(() => {
            isSpinning = false;
            showModal(selectedWinner);
          }, 1000);
        }
      }

      requestAnimationFrame(animate);
    }

    function showModal(winner) {
      const modal = document.getElementById("modalOverlay");
      const modalCard = document.getElementById("modalCard");
      const videoFrame = document.getElementById("videoFrame");
      const winnerDisplay = document.getElementById("winnerNameDisplay");

      winnerDisplay.innerText = winner.toUpperCase();

      videoFrame.classList.remove("hidden");
      modalCard.classList.remove("no-video-card");

      videoElement.controls = true;
      videoElement.src = `Selected-video/${winner.toLowerCase()}.mp4`;
      videoElement.play().catch(() => {});

      modal.classList.add("active");
    }

    function closeModal() {
      const modal = document.getElementById("modalOverlay");
      videoElement.pause();
      videoElement.removeAttribute("src");
      modal.classList.remove("active");
      document.getElementById("runBtn").disabled = false;
    }

    function handleOverlayClick(event) {
      const modalCard = document.getElementById("modalCard");
      if (!modalCard.contains(event.target)) {
        closeModal();
      }
    }

    function removeAndNext() {
      const idx = names.indexOf(selectedWinner);
      if (idx > -1) {
        names.splice(idx, 1);
      }
      closeModal();
      handleDataUpdate();
    }

    /* Team Management Functions */
    function syncTeamData() {
      const currentNames = [...names];
      const updatedAssignments = [];

      currentNames.forEach((name, i) => {
        const existing = teamAssignments.find(item => item.name === name);
        if (existing) {
          updatedAssignments.push(existing);
        } else {
          updatedAssignments.push({
            name: name,
            points: 5,
            teamIndex: i % teamCount
          });
        }
      });

      teamAssignments = updatedAssignments;
      rebalanceTeams();
      renderTeamsUI();
    }

    function rebalanceTeams() {
      teamAssignments.forEach(item => {
        if (item.teamIndex >= teamCount) {
          item.teamIndex = item.teamIndex % teamCount;
        }
      });
    }

    function changeTeamCount(val) {
      teamCount = parseInt(val, 10);
      rebalanceTeams();
      renderTeamsUI();
    }

    function shuffleTeams() {
      const shuffledNames = [...teamAssignments].sort(() => Math.random() - 0.5);
      shuffledNames.forEach((item, index) => {
        item.teamIndex = index % teamCount;
      });
      teamAssignments = shuffledNames;
      renderTeamsUI();
    }

    function adjustPoints(event, memberName, amount) {
      if (event) event.stopPropagation();
      const member = teamAssignments.find(m => m.name === memberName);
      if (member) {
        member.points = Math.max(0, member.points + amount);
        renderTeamsUI();
      }
    }

    function renderTeamsUI() {
      const grid = document.getElementById("teamsGrid");
      grid.className = `teams-grid teams-${teamCount}`;
      grid.innerHTML = "";

      for (let t = 0; t < teamCount; t++) {
        const teamCol = document.createElement("div");
        teamCol.className = "team-column";

        const teamMembers = teamAssignments.filter(m => m.teamIndex === t);
        const totalPoints = teamMembers.reduce((sum, m) => sum + m.points, 0);

        let membersHTML = "";
        teamMembers.forEach(m => {
          membersHTML += `
            <div class="team-member-row">
              <span class="member-name">${m.name}</span>
              <div class="points-control">
                <button class="btn-point" onclick="adjustPoints(event, '${m.name}', -1)">-</button>
                <span class="points-val">${m.points}</span>
                <button class="btn-point" onclick="adjustPoints(event, '${m.name}', 1)">+</button>
              </div>
            </div>
          `;
        });

        teamCol.innerHTML = `
          <div class="team-column-title">Team ${t + 1}</div>
          <div class="team-members-list">${membersHTML}</div>
          <div class="team-total-row">Total Point = ${totalPoints}</div>
        `;

        grid.appendChild(teamCol);
      }
    }

    function openTeamModal() {
      syncTeamData();
      document.getElementById("teamModalOverlay").classList.add("active");
    }

    function closeTeamModal() {
      document.getElementById("teamModalOverlay").classList.remove("active");
    }

    function handleTeamOverlayClick(event) {
      const card = document.getElementById("teamModalCard");
      if (!card.contains(event.target)) {
        closeTeamModal();
      }
    }

    canvas.addEventListener("click", () => {
      if (!isSpinning) spinWheel();
    });

    handleDataUpdate();
  </script>
</body>
</html>
